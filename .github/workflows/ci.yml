name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE, CORRECTED 2026-08-22 (S0074). This note used to say that Phase C of the standardization
# campaign REPLACES this hand-rolled workflow with a thin caller of the reusable workflow in
# cosyte/.github. That was stale and contradicted both release.yml and RELEASING.md, which argue at
# length that this repo structurally cannot be a caller. Phase C was measured against this repo and
# DECLINED, for two reasons that are properties of the multi-package shape rather than of effort: the
# shared release-notes gate answers "is a release pending" from the ROOT package.json version, which
# here is `cosyte-config` `private: true` pinned at 0.0.0 and never versioned by Changesets, so
# adopting it would withhold every publish on a green run; and the shared workflow tags `v<version>`,
# which collides when eight packages publish in one run. See RELEASING.md, "Why this repository is not
# a thin caller of the shared workflow". Pinning every action to a commit SHA is still owed and is
# unrelated to the caller question.
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Low end stays "22" (the required-status-check context is `verify (22)`); setup-node
        # resolves it to the latest 22.x, which is >= the declared 22.14 floor. The floor is declared
        # in engines.node and pinned explicitly on the publish path (release.yml + release-dry-run).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed by the release-notes gate below, which classifies HEAD against HEAD^ and reads the
          # changesets a version commit consumed out of the parent tree. A shallow clone has no
          # HEAD^, and the gate would report "no release pending" on every run: green, and blind.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # THE TWO RELEASE GATES, RUN HERE RATHER THAN ONLY IN release.yml, and for the same reason the
      # em-dash gate is duplicated below: `verify` is a REQUIRED status check in this repo's
      # `config-ci-required-checks` ruleset, so this is the half that can be made blocking from
      # inside the repo. Running them only on push-to-main would catch both defects after the merge
      # that triggers the release, which for the notes gate means after an approver has already been
      # asked to approve a run that cannot succeed.
      #
      # Both are zero-dependency node, so they run before install.
      #
      # On a "Version Packages" PR this is exactly the right check. `actions/checkout` builds a merge
      # commit whose first parent is the base branch, so HEAD carries the bumped versions with the
      # changesets deleted and HEAD^ carries the changesets: the same shape the push-to-main run will
      # see, one merge earlier.
      - run: node scripts/changeset-guard.mjs
      - run: node scripts/release-notes.mjs prepare --repo . --out "$RUNNER_TEMP/release-notes"
      - run: pnpm install --frozen-lockfile
      # The em-dash brand gate's FILE half also runs in no-emdash.yml, which additionally
      # covers the PR title, body and commit messages and carries the `edited` trigger those
      # need. It is repeated here for one reason worth stating plainly: `verify` is a REQUIRED
      # status check in this repo's `config-ci-required-checks` ruleset and `no-emdash` is not,
      # so without this line the gate would run, be visible, and still not block a merge. Making
      # it required is a ruleset change; this is the half that can be made blocking from inside
      # the repo. Cheap enough to run twice (a checkout and one grep).
      - run: pnpm check:no-emdash
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # NOTE: `pnpm test:perf` is deliberately NOT run here. It holds the only tests that read a real
      # clock, and PERF-P2's own false-alarm sweeps measured this class of runner firing on a LINEAR
      # workload 4 times in 600 runs and failing to reach steady state in another ~1%, so as a
      # REQUIRED check it would be a known-flaky gate, which is roadmap §5's risk #1 ("a gate that
      # false-alarms gets disabled, and then there is no gate"). It also does not currently hold on
      # Node 24, which is half this matrix. The kit's decision logic is fully covered by `pnpm test`
      # on an injected clock; what `test:perf` adds is the measurement, and that stays a deliberate
      # command until P4 settles the ceiling question with the founder.
      # Evidence: experiments/perf-p2-false-alarm/ANALYSIS.md.
      # Build the workspace's TS packages (test-utils is the first), then verify
      # their published types resolve under every module mode.
      - run: pnpm build
      - run: pnpm attw

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  # Prove the publish pipeline on every push/PR WITHOUT burning a version (REL-PIPE). No registry
  # auth, no upload: `publish --dry-run` exercises the publish command path (the release itself
  # publishes via `changeset publish`; this is a faithful proxy for the pack/manifest/access path).
  # It is green as "no new packages" until a changeset bumps a version, at which point it
  # packs+validates that version. Separately, and on every push/PR rather than only when a version
  # moves, `npm pack --dry-run` asserts each publishable tarball actually assembles with the right
  # file set + built dist, independent of what's already on npm. A red here means a real
  # release would fail. Real provenance publish stays gated on the public flip (PUB-FLIP).
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Exercise the publish command path (auth-free dry run; never uploads).
      - name: Publish dry-run
        run: pnpm -r publish --dry-run --no-git-checks
      # Assert every publishable tarball assembles (catches missing files/dist/exports) even when
      # the current version is already on npm, which `publish --dry-run` skips.
      - name: Pack integrity
        run: pnpm -r --filter "./packages/*" exec npm pack --dry-run
