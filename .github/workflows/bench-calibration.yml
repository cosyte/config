name: Benchmark comparison calibration

# Not a gate and never one: it asserts nothing, and its whole output is a dataset. It calibrates the
# base against head comparison in @cosyte/bench on the runner class it runs on (one GitHub-hosted
# runner), so the rates in documentation/decisions/0005-the-performance-standard.md come from that
# class and not from a developer machine.
#
# It runs when a pull request that changes the comparison itself (the package's source or the
# calibration scripts) is opened or reopened, so the change is calibrated before it merges, and by
# hand. Not on every push: GitHub reads a pull request's paths over its whole diff, so a push that
# changed only a document would start the whole calibration again. Each job is one
# runner with one lane, the way a pull request's comparison has a runner to itself, and runs whole
# comparisons until its time budget ends; a comparison of the PHI scan suite takes a few minutes.
#
# - `aa`: A/A comparisons, both sides the same code, so every regression verdict is a false alarm.
#   Six runners at once, so the count grows six times as fast; the standard's required-check rule
#   reads their summary.
# - `inject`: comparisons with a planted slowdown of a nominal 5%, 10% and 20% on the head side. The
#   change a comparison measures under it is not exactly that fraction, so each result reports the
#   change it observed per case, and a detection rate is read against that.
# - `large`: A/A comparisons of the large-case suite (`experiments/bench-calibration/large.bench.mjs`),
#   whose compared case runs on the large-case plan, six runners at once.
# - `readings`: a reading of the PHI scan suite, the long run's leak calibration, and a reading of the
#   large-case suite with the base branch's runner and with this one, so a change to the method shows
#   what it changes on one machine.
# - `summary`: every table in the standard's section 5, from the artifacts above, in the job summary.
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - "packages/bench/src/**"
      - "experiments/bench-calibration/calibrate.sh"
      - "experiments/bench-calibration/long-run.sh"
      - "experiments/bench-calibration/large.bench.mjs"
      - "experiments/bench-calibration/large-target.mjs"
      - ".github/workflows/bench-calibration.yml"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of comparisons per runner"
        type: string
        default: "80"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MINUTES: ${{ inputs.minutes || '80' }}

jobs:
  calibrate:
    name: calibrate (${{ matrix.suite || 'phi-scan' }}, ${{ matrix.inject }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { inject: "0", shard: "1" }
          - { inject: "0", shard: "2" }
          - { inject: "0", shard: "3" }
          - { inject: "0", shard: "4" }
          - { inject: "0", shard: "5" }
          - { inject: "0", shard: "6" }
          - { inject: "0.05", shard: "1" }
          - { inject: "0.10", shard: "1" }
          - { inject: "0.20", shard: "1" }
          - { inject: "0", shard: "1", suite: large }
          - { inject: "0", shard: "2", suite: large }
          - { inject: "0", shard: "3", suite: large }
          - { inject: "0", shard: "4", suite: large }
          - { inject: "0", shard: "5", suite: large }
          - { inject: "0", shard: "6", suite: large }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cosyte/bench run build
      - name: Calibrate
        env:
          INJECT: ${{ matrix.inject }}
          SHARD: ${{ matrix.shard }}
          SUITE_NAME: ${{ matrix.suite || 'phi-scan' }}
        # One comparison per results file, so a job stopped by its timeout keeps every finished one.
        run: |
          if [ "$SUITE_NAME" = "large" ]; then
            export SUITE="$PWD/experiments/bench-calibration/large.bench.mjs"
            export TARGET="$PWD/experiments/bench-calibration/large-target.mjs"
          fi
          DEADLINE=$(( $(date +%s) + MINUTES * 60 )) \
            experiments/bench-calibration/calibrate.sh "$INJECT" 1000 1 none 1 \
            "$RUNNER_TEMP/calibration/$SUITE_NAME/inject-$INJECT/shard-$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-calibration-${{ matrix.suite == 'large' && 'large-' || '' }}inject-${{ matrix.inject }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/calibration/
          if-no-files-found: error

  readings:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cosyte/bench run build
      - name: Read the PHI scan suite
        run: |
          mkdir -p "$RUNNER_TEMP/readings"
          node packages/bench/dist/cli.mjs run --suite packages/script-utils/bench/phi-scan.bench.mjs \
            --target packages/script-utils/phi-scan.js --out "$RUNNER_TEMP/readings/phi-scan-reading.json" \
            --summary "$RUNNER_TEMP/readings/phi-scan-reading.md"
          cat "$RUNNER_TEMP/readings/phi-scan-reading.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Calibrate the long run
        run: experiments/bench-calibration/long-run.sh 10 none "$RUNNER_TEMP/readings/long-run"
      # The base branch's runner, built beside this one, for a reading of the large-case suite with
      # each: what a change to the method changes, on one machine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base
          persist-credentials: false
      - run: pnpm -C base install --frozen-lockfile
      - run: pnpm -C base --filter @cosyte/bench run build
      - name: Read the large-case suite with the base's runner and with this one
        run: |
          for side in base head; do
            cli=packages/bench/dist/cli.mjs
            if [ "$side" = "base" ]; then cli=base/packages/bench/dist/cli.mjs; fi
            node "$cli" run --suite experiments/bench-calibration/large.bench.mjs \
              --target experiments/bench-calibration/large-target.mjs --no-import \
              --out "$RUNNER_TEMP/readings/large-reading-$side.json" \
              --summary "$RUNNER_TEMP/readings/large-reading-$side.md"
            { echo "#### The large-case suite, read with the $side runner"; echo
              cat "$RUNNER_TEMP/readings/large-reading-$side.md"; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-readings
          path: ${{ runner.temp }}/readings/
          if-no-files-found: error

  summary:
    needs: [calibrate, readings]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cosyte/bench run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Summarize
        run: |
          {
            echo "## Comparison calibration"
            node experiments/bench-calibration/analyze.mjs compare "$RUNNER_TEMP"/artifacts/bench-calibration-inject-*
            echo
            echo "## Large-case comparison calibration"
            node experiments/bench-calibration/analyze.mjs compare "$RUNNER_TEMP"/artifacts/bench-calibration-large-*
            echo
            echo "## Long run"
            node experiments/bench-calibration/analyze.mjs long-run "$RUNNER_TEMP/artifacts/bench-readings/long-run"
          } | tee -a "$GITHUB_STEP_SUMMARY"
