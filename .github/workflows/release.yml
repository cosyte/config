name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the version PR / tags / releases
  id-token: write # npm provenance
  pull-requests: write # open the "Version Packages" PR

# Changesets flow: a push to main with pending changesets opens a "Version Packages" PR. Merging that
# PR bumps versions and triggers this workflow again, and that run publishes.
#
# ---------------------------------------------------------------------------
# THE SPLIT: ONE UNGATED `version` JOB, ONE GATED `publish` JOB (S0074, 2026-08-22).
#
# Until this change the whole thing was a SINGLE job carrying `environment: release`, so GitHub held
# it in `Waiting` before step one and a human had to approve a run merely to have a Version Packages
# PR opened or refreshed. The measurement in documentation/release-stall-evidence.md is what ended
# that arrangement: at 2026-08-22T21:50Z, 62 Release runs across the 16 `.changeset/`-carrying
# repositories were sitting in `waiting` on a single required reviewer, and the only two Version
# Packages PRs stalled past 72 idle hours in 185 measured PRs (fhir#73, terminology#62) both sat with
# every required check GREEN and a held release run overlapping the stall.
#
# What changed, exactly, and what did NOT:
#
#   * `preflight` (UNGATED) runs both release gates and the whole verify ladder. This is the half
#     that fixes a documented lie: with `environment: release` at job level, the guard and the notes
#     gate ran AFTER the approval, so an approver could be asked to approve a run that could not
#     succeed. They now run before anyone is asked for anything.
#   * `version` (UNGATED) opens or refreshes the Version Packages PR. It is given NO `publish:` input
#     and NO npm credentials, so it cannot reach the registry even if something else here is wrong.
#     It carries its own copy of the Gate 1 accounting check, because the split would otherwise have
#     let one push (a version commit that ALSO carries a pending changeset) skip both arms' checks
#     and go green with packages bumped and unpublished. See that step for the full argument.
#   * `publish` (GATED, `environment: release`) is the only job that can publish, and it still waits
#     for the required reviewer. NOTHING REACHES npm ANY MORE EASILY THAN IT DID BEFORE. A published
#     version is permanent and this workflow cannot withdraw one, which is why the gate stays exactly
#     where the risk is.
#
# WHY THE ARM CONDITION IS NOT A CLASSIFIER, and this is the part not to "simplify". This repo
# deliberately refuses to gate the publish on `release-notes.mjs`'s `is-release` output, because a
# classifier that wrongly answered "not a release" would WITHHOLD A PUBLISH ON A GREEN RUN, which is
# the exact silent-withholding failure Gate 1 exists to close (run 30640138565, 2026-07-31). That
# refusal is unchanged. The arm condition below is `has-changesets`, which is the SAME question
# `changesets/action` asks itself to choose its own arm ("are there pending changesets"), computed
# from the same directory by the same rule. Moving that question one step earlier cannot change what
# publishes: on the branch where it is wrong, the action would have taken the version arm and
# published nothing anyway.
# ---------------------------------------------------------------------------
#
# AUTH TODAY: NPM_TOKEN. This repo is PUBLIC, so npm provenance is already live; `NPM_CONFIG_PROVENANCE`
# auto-enables below on the public visibility check. The runner toolchain floor is bumped for OIDC
# (packageManager `pnpm@10.34.5` >= 10.16, Node `22.14`; publish runs via `pnpm run release`, so pnpm,
# not npm, carries trusted publishing). What remains for tokenless OIDC is a FOUNDER step, not a build:
# register the npm-side Trusted Publisher, then remove NPM_TOKEN / NODE_AUTH_TOKEN here. RELEASING.md
# has the turnkey steps. Until then, NPM_TOKEN must stay an npm *Automation* token.
#
# ---------------------------------------------------------------------------
# WHY THIS IS STILL A STANDALONE WORKFLOW AND NOT A THIN CALLER OF
# `cosyte/.github/.github/workflows/release.yml@main`, MEASURED 2026-08-04, RE-MEASURED 2026-08-22.
#
# Thirteen of the fourteen `.changeset/`-carrying repositories that have a release workflow call the
# shared reusable workflow; this repo is the one that does not, and the reason is structural:
#
#   1. THE SHARED GATE WOULD WITHHOLD EVERY CONFIG PUBLISH, PERMANENTLY, ON A GREEN RUN. Its
#      `release-notes.mjs` answers "is a release pending" from the ROOT package.json's version
#      (`packageVersionAt` reads `<rev>:package.json`). This repo's root manifest is `cosyte-config`,
#      `private: true`, pinned at `0.0.0`; Changesets does not version a private root package, so that
#      value has never changed in this repo's history and never will. Running the shared `prepare`
#      against this repo returns `is-release=false` with code `never-versioned`. The shared workflow
#      supplies `publish:` ONLY when `is-release == 'true'`, so adopting it would silently withhold
#      every release here. That is a strictly worse instance of the exact silent-withholding class
#      this file exists to close, so it was not adopted.
#
#   2. IT TAGS `v<version>`, WHICH IS THE WRONG TAG FOR THIS REPO. Its own comment states the
#      assumption: "Every caller of this workflow is a single-package repo, for which Changesets tags
#      `v<version>`; it uses `<pkg>@<version>` only in a multi-package repo." This repo publishes
#      EIGHT packages and its existing tags are all `<pkg>@<version>`.
#
# Both are properties of the multi-package shape, not of this file, so the fix was to port the two
# things that ARE portable (the RELEASE_PR_TOKEN wiring below, and a release-notes gate rebuilt for
# this repo in scripts/release-notes.mjs) rather than to bend the shared workflow around one caller.
# The split above is the third thing that is portable, and it is the ONE that matters most to the
# other thirteen: it is filed as a follow-on in documentation/release-stall-evidence.md, because this
# spec may not edit any repository other than this one.
# ---------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------------------
  # PREFLIGHT. Ungated on purpose: everything that can refuse a release is asked here, so no human is
  # ever asked to approve a run that was already doomed. Read-only permissions, no npm credentials.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.pending.outputs.has-changesets }}
      is-release: ${{ steps.notes.outputs.is-release }}
      packages: ${{ steps.notes.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes gate classifies HEAD against HEAD^ and reads the changesets a version commit
          # consumed out of the parent tree. A shallow clone has no HEAD^ and the gate would report
          # "no release pending" on every run: green, and blind.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # GATE 1: REFUSE A CHANGESET THAT BUMPS NOTHING.
      #
      # `changesets/action` given only inert changesets logs "All changesets are empty; not creating
      # PR", publishes nothing, and EXITS 0. Run 30640138565 (2026-07-31) did exactly that: approved
      # through the release environment as a real publish, reported success, and shipped none of the
      # six packages whose manifests were already a patch ahead of the registry. A green run that did
      # nothing is worse than a red one, because the conclusion is the only thing anyone reads.
      #
      # It runs FIRST, before install, because it needs nothing but node.
      # scripts/changeset-guard.mjs is zero-dependency for that reason.
      #
      # BEFORE S0074 THIS COPY RAN AFTER THE APPROVAL, because `environment: release` sat at job
      # level and GitHub held the whole job in `Waiting` before step one. It now runs in an ungated
      # job, so the claim RELEASING.md always made for it ("before an approver is asked for
      # anything") is finally true of this file as well as of ci.yml.
      - name: Changesets must be able to bump something
        run: node scripts/changeset-guard.mjs

      # GATE 2: EVERY RELEASE BODY MUST BE DERIVABLE, BEFORE NPM IS TOUCHED.
      #
      # `createGithubReleases` is turned OFF below, so this is what supplies the bodies instead. The
      # derivation reads the changesets the version commit consumed, which are in the tree at HEAD^,
      # so the whole check can run here with the registry untouched. A published version is permanent
      # (ADR 0001), so a check that runs after the publish is a complaint rather than a gate.
      #
      # On an ordinary push this writes nothing and reports "No release pending". Note what is NOT
      # done with that answer: IT DOES NOT DECIDE WHICH ARM RUNS. `has-changesets` below does, and
      # the header explains why the difference is load-bearing. A misclassification here reddens a
      # run; it never withholds one silently.
      - name: Release notes must be derivable
        id: notes
        run: |
          node scripts/release-notes.mjs prepare --repo . --out "$RUNNER_TEMP/release-notes"

      # WHICH ARM. This is the same question `changesets/action` asks itself, computed from the same
      # directory by the same rule, one step earlier so that a job boundary (and therefore an
      # environment gate) can sit between the two arms.
      #
      # COUPLED, DELIBERATELY, TO scripts/changeset-guard.mjs: its `NOT_A_CHANGESET` set is exactly
      # `README.md` + `config.json`, and its own no-changesets branch says so in terms ("no changesets
      # pending, which is the publish arm"). Filtered to `*.md`, that set reduces to "every .md except
      # README.md", which is what the find below expresses. If `NOT_A_CHANGESET` ever changes, change
      # this with it.
      #
      # PLAIN `find` RATHER THAN NODE, deliberately: this runs before install, and `node -e` executes
      # as CommonJS or ESM depending on flags and on the nearest package.json (this repo declares
      # `"type": "module"`), which is one more thing that could differ between a runner and a laptop
      # for no gain. `find` has no such question. `-maxdepth 1` keeps it to the directory Changesets
      # itself reads, and the count is over regular files only.
      - name: Which arm does this push take
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          pending=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
            echo "$pending pending changeset(s): this push takes the VERSION arm, which is ungated."
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets: this push takes the PUBLISH arm, gated on the release environment."
          fi

      - run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm check:no-emdash
          pnpm format:check
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm attw

  # ---------------------------------------------------------------------------
  # VERSION ARM. Ungated. Opens or refreshes the "Version Packages" PR and NOTHING ELSE. No
  # `publish:` input, no NPM_TOKEN, no `id-token`, so this job cannot reach the registry.
  # ---------------------------------------------------------------------------
  version:
    needs: preflight
    if: ${{ needs.preflight.outputs.has-changesets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit to changeset-release/main
      pull-requests: write # open / update the "Version Packages" PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # HALF OF THE VERSION-PR FIX, and the half that keeps working after the second changeset.
          # Left at its default, the GITHUB_TOKEN that `actions/checkout` persists as an
          # `http.<host>.extraheader` outranks the `~/.netrc` that `changesets/action` writes, and git
          # sends it preemptively. The version commit is pushed by `git push` out of this checkout,
          # not through the API, so without this the push stays GITHUB_TOKEN-authored no matter which
          # token the action was given, and every `synchronize` on the Version PR returns it to zero
          # applicable checks. Clearing it lets the netrc authenticate that push.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: pnpm

      # Say plainly, in the log of the run that is about to open the PR, whether that PR will be
      # mergeable. GitHub does not start workflow runs for events produced by GITHUB_TOKEN, so a
      # Version PR opened with it arrives with ZERO checks, and a required check that never reports
      # is PENDING rather than failing: with `bypass_actors: []` on the rulesets nobody can merge
      # past it, an admin included. Without RELEASE_PR_TOKEN this is not a degraded fix, it is no
      # fix, and the symptom reads like a slow queue rather than a permanent block.
      #
      # The token branch is in bash rather than a step-level `if` because the `secrets` context is
      # not available to `jobs.<id>.steps.<id>.if`; actionlint catches that and the way to satisfy it
      # is `env`, which can read it.
      - name: Report whether a version PR would be able to run its checks
        env:
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
        shell: bash
        run: |
          if [ "$HAS_RELEASE_PR_TOKEN" = "true" ]; then
            echo "RELEASE_PR_TOKEN is set. If this run opens a Version Packages PR, that PR will be"
            echo "authored by the token's owner, so its required checks will actually run."
          else
            echo "::warning title=Version PR will land with zero checks::RELEASE_PR_TOKEN is not set, so if this run opens a Version Packages PR it will be authored by GITHUB_TOKEN. GitHub does not start workflow runs for that token's events, required checks that never report count as PENDING rather than failing, and with bypass_actors empty the PR cannot be merged by anyone, an admin included. Set RELEASE_PR_TOKEN to fix it."
          fi

      - run: pnpm install --frozen-lockfile

      - name: Open or refresh the Version Packages PR
        # PINNED TO A SHA, and this one is load-bearing rather than routine hygiene. The whole
        # tag-creation design in the publish job rests on a property of the action's INTERNALS:
        # `git.pushTag` sits inside `if (createGithubReleases)` in its run.ts, so turning that flag
        # off makes the tag step there the only thing that creates a tag. That property was measured
        # at THIS sha, which is also the one cosyte/.github pins for every parser, so a floating `@v1`
        # could move the behaviour this file depends on without any diff here.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1
        with:
          # `pnpm run version`, NOT `pnpm version`, which is pnpm's built-in and shadows the script.
          version: pnpm run version
          # NO `publish:` INPUT, DELIBERATELY, AND IT IS THIS JOB'S WHOLE SAFETY PROPERTY. The action
          # only ever calls `runPublish` when a publish script was supplied; with none, the version
          # arm is the only arm it can take. Combined with the absent NPM_TOKEN below, an ungated job
          # that reached the registry would need two independent mistakes rather than one.
          createGithubReleases: false
        env:
          # The other half of the version-PR fix: this is the token the action opens the PR with. It
          # MUST be set here rather than through the `github-token` input, which this env var takes
          # precedence over in the action's own source (`process.env.GITHUB_TOKEN ||
          # core.getInput("github-token")`), so adding the input while leaving the env in place would
          # be a silent no-op.
          #
          # ABSENT, IT FALLS BACK AND WARNS. RELEASE_PR_TOKEN is optional: without it this is exactly
          # the old behaviour, trap included, and the step above says so loudly.
          #
          # SCOPE IT NARROWLY when creating it: a fine-grained PAT with `Contents: read+write`,
          # `Pull requests: read+write`, `Metadata: read` on this repo and nothing else. It does NOT
          # need `Workflows: write`: `pnpm run version` changes `packages/*/package.json`,
          # `packages/*/CHANGELOG.md` and `.changeset/`, none of which is under `.github/workflows/`.
          #
          # NOTE THE ABSENCE OF NPM_TOKEN / NODE_AUTH_TOKEN HERE. That absence is a control, not an
          # oversight: see the `publish:` comment above.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      # THE GATE 1 SAFETY NET, RESTORED ON THIS ARM. Do not delete it as a duplicate of the step in
      # `publish`: it covers the one push that reaches NEITHER of them otherwise.
      #
      # When this file was a single job, `Every bumped package must be published, tagged and
      # released` ran on `!cancelled() && is-release == 'true'` whichever arm the single
      # `changesets/action` call took, so it covered this case for free. The split moved it into
      # `publish`, which this arm skips, and the two conditions are INDEPENDENT: `is-release` asks
      # whether a publishable version moved between HEAD^ and HEAD, `has-changesets` asks whether
      # `.changeset/` still holds pending changesets at HEAD. Both are true on a push that merges a
      # Version Packages PR while a NEWER changeset has landed on `main` since that PR was last
      # refreshed. Before the split that push reddened with `Bumped but never published`; without
      # this step it would go GREEN with packages bumped on `main` and nothing on the registry, which
      # is the silent-withholding class run 30640138565 (2026-07-31) taught this repo to refuse.
      #
      # IT CANNOT PUBLISH AND IS NOT MEANT TO: this job has no npm credentials, deliberately, and
      # that absence is the version arm's whole safety property. It reads the PUBLIC registry and
      # reports. The state is real and needs a human, so it exits non-zero, and it does so AFTER the
      # step above, so the run reds without withholding the Version Packages PR.
      #
      # `!cancelled()` rather than a bare `if:` for the same reason as in `publish`: an earlier step
      # failing on a version commit is exactly when this is worth saying, and the message names both
      # readings.
      - name: A version commit taking this arm must not go green unpublished
        if: ${{ !cancelled() && needs.preflight.outputs.is-release == 'true' }}
        env:
          BUMPED_PACKAGES: ${{ needs.preflight.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail

          worklist="$RUNNER_TEMP/bumped-version-arm.tsv"
          # shellcheck disable=SC2016  # single quotes are deliberate: this is JS reading process.env,
          # not shell expansion. Interpolating the JSON into the script would break on any quote in it.
          node -e '
            const packages = JSON.parse(process.env.BUMPED_PACKAGES ?? "[]");
            if (!Array.isArray(packages) || packages.length === 0) {
              throw new Error("the notes gate reported a release but named no packages");
            }
            for (const entry of packages) process.stdout.write(`${entry.name}\t${entry.version}\n`);
          ' > "$worklist"

          missing=()
          while IFS=$'\t' read -r name version; do
            [ -n "$name" ] || continue

            # Retried for the same reason the publish arm retries: a version that has just reached
            # the registry can 404 for a few seconds while it propagates.
            onnpm=false
            for attempt in 1 2 3; do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                onnpm=true
                break
              fi
              [ "$attempt" -eq 3 ] || sleep 5
            done

            if [ "$onnpm" != "true" ]; then
              missing+=("${name}@${version}")
            fi
          done < "$worklist"

          if [ ${#missing[@]} -eq 0 ]; then
            echo "This commit bumped versions and this push still carries pending changesets, so the"
            echo "publish arm did not run. Every bumped package is already on the registry, so"
            echo "nothing is being withheld."
            exit 0
          fi

          echo "::error title=Bumped but never published (version arm)::${#missing[@]} package(s) were" \
               "bumped by this commit but are not on the registry: ${missing[*]}. This push carries a" \
               "pending changeset AS WELL AS a version bump, so it took the ungated version arm and the" \
               "gated publish arm never ran; or an earlier step in this job failed. RELEASING.md failure" \
               "state (c) has the terminal action: merge the Version Packages PR this run just opened," \
               "or land a changeset-free commit on main. Either takes the publish arm and publishes these."
          exit 1

  # ---------------------------------------------------------------------------
  # PUBLISH ARM. GATED on the protected `release` environment, which is the human acknowledgment and
  # stays exactly where it was. This is the only job in this file that can reach npm.
  # ---------------------------------------------------------------------------
  publish:
    needs: preflight
    if: ${{ needs.preflight.outputs.has-changesets != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags / GitHub releases
      id-token: write # npm provenance
    # Release approval gate: the `release` environment carries a required reviewer (`NSchatz`) and a
    # `main`-only deployment-branch policy, so the publish waits for an explicit approval. This is
    # also the OIDC subject an npm Trusted Publisher would bind to.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # GATE 3: THE EFFECTIVE CONFIGURATION OF THIS PUBLISH MUST BE ONE SOMEBODY APPROVED.
      #
      # THE HOLE THIS CLOSES (S0055 finding F9). Everything that decides WHERE these tarballs go,
      # WHAT goes inside them and WHAT METADATA rides along is npm/pnpm configuration, and that
      # configuration is assembled at publish time out of sources nothing in this repository used to
      # inspect: a global npmrc, the user npmrc `actions/setup-node` GENERATES two steps above and
      # points NPM_CONFIG_USERCONFIG at, a repository or per-package `.npmrc`, `pnpm-workspace.yaml`,
      # the root manifest's `pnpm` block, each package's `publishConfig`, `.changeset/config.json`,
      # and this job's environment. A redirected `registry`, a disabled `provenance`, a widened
      # `access` or an injected lifecycle-script setting changes what reaches the public registry
      # WITHOUT changing a tracked file in a way review would see.
      #
      # WHY IT RUNS HERE AND NOT IN `preflight`, and this is the part not to "simplify". Effective
      # configuration is a property of a SPECIFIC PROCESS: its environment, its working directory,
      # and the home directory of the runner in a specific job. `preflight` runs with different
      # permissions, no npm credentials and no `release` environment, so a configuration observed
      # there is not evidence about this publish. A green answer about the wrong process is worse
      # than no answer, because the conclusion is the only thing anyone reads. The accepted cost is
      # that a refusal here happens after an approver has already approved the run.
      #
      # THE `env:` BLOCK BELOW IS THE PUBLISH STEP'S, MINUS EXACTLY ONE VARIABLE, AND BOTH HALVES OF
      # THAT ARE DELIBERATE. It is DECLARED in .github/credential-surface.json (S0080), which is what
      # made this decision a reviewed one rather than a default.
      #
      #   * NPM_CONFIG_PROVENANCE is npm CONFIGURATION supplied at STEP level, so a check that ran
      #     without it would be reporting on a configuration the publish does not have. That is the
      #     same class of error as running this check in `preflight`.
      #   * NODE_AUTH_TOKEN is here because the user npmrc `actions/setup-node` generates two steps
      #     above contains `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and npm expands
      #     that reference when it resolves configuration. Without the variable this step would be
      #     reading a DIFFERENT state of that file than the publish reads: an unresolvable
      #     reference, which this gate is fail-closed about. It would refuse every release, or worse
      #     depend on the npm version's tolerance for it.
      #   * NPM_TOKEN is NOT here, and that omission is the point of naming this block at all.
      #     Nothing on the configuration path reads it: npm reads only `npm_config_*` variables, and
      #     the registry credential reaches npm through the generated npmrc above. It is in the
      #     publish step because `changesets/action` wants it. Copying it here would widen this
      #     repository's declared credential surface by one step and buy this check nothing, and a
      #     surface that grows for nothing is exactly what credential-surface.mjs exists to refuse.
      #
      # If the publish step's npm CONFIGURATION env changes, change this with it, and update
      # .github/credential-surface.json in the same commit. The check never prints a credential
      # value; see its redaction rule and the suite that proves it (test/npm-config-allow.test.ts).
      #
      # IT RUNS BEFORE `pnpm install`, so nothing has been fetched or built under a configuration
      # nobody approved, and it is zero-dependency for that reason. It ADDS a refusal after the
      # existing environment gate; it removes, loosens and relocates nothing.
      - name: The publish configuration must be one the allow-set permits
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: node scripts/npm-config-allow.mjs

      # Re-derived here rather than carried across the job boundary as an artifact. It is a pure
      # function of the checked-out git history, `preflight` has already refused the run if it cannot
      # be derived, and re-running it is cheaper and less fragile than uploading and downloading a
      # directory of markdown. The step below needs the FILES, not just the outputs.
      - name: Derive the release bodies
        id: notes
        run: |
          node scripts/release-notes.mjs prepare --repo . --out "$RUNNER_TEMP/release-notes"

      - run: pnpm install --frozen-lockfile

      - name: Publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1
        with:
          version: pnpm run version
          # UNCONDITIONAL, AND IT STAYS THAT WAY. This repo does not gate the publish on its own
          # classifier: a classifier that wrongly said "not a release" would withhold a publish on a
          # green run, which is the failure Gate 1 exists to close.
          publish: pnpm run release
          # DEFAULTS TO TRUE, AND THAT DEFAULT SHIPPED THE DEFECT. With it on, the action cuts one
          # GitHub release per package and builds each body by finding a `## <version>` heading in
          # that package's CHANGELOG.md. Every package here sets `"changelog": false` and
          # hand-maintains its CHANGELOG, so `changeset version` writes no such heading, the action
          # finds none, and its fallback is to use the WHOLE FILE. On 2026-07-31 all six bodies
          # published as the raw CHANGELOG, `# Changelog` preamble and `## [Unreleased]` included.
          #
          # Turning it off removes the dumping behaviour outright. The replacement bodies come from
          # the notes gate above, and the step below creates the releases.
          #
          # CONSEQUENCE WORTH KNOWING: with this false the action also stops PUSHING the tags that
          # `changeset publish` creates in the runner's local clone. That is why the step below uses
          # `gh release create --target`, which creates the tag itself. One tag, one release, both
          # created there.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance requires a PUBLIC source repo; auto-enables when this repo is public.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}

      # EVERY PACKAGE THIS COMMIT BUMPED MUST END UP ON npm, TAGGED, AND RELEASED. THIS STEP IS
      # DRIVEN BY WHAT THE VERSION COMMIT BUMPED, NOT BY WHAT THIS PARTICULAR RUN PUBLISHED, AND THE
      # DIFFERENCE IS THE WHOLE POINT.
      #
      # THE HOLE THIS CLOSES, found by the gate-refuter against the first draft of this file, which
      # keyed off `steps.changesets.outputs.published == 'true'` and looped over `publishedPackages`.
      # Turning `createGithubReleases` off means `git.pushTag` is never reached (it sits inside
      # `if (createGithubReleases)` in the action's own run.ts), so this step is the ONLY thing that
      # creates a tag. Combine that with a partial failure and a green re-run appears:
      #
      #   Six packages publish. `gh release create` succeeds for two and fails on the third (a
      #   transient 5xx, a timeout, a rate limit). The step reds, so the run reds, so an operator
      #   re-runs it. On the re-run `changeset publish` finds all six already on the registry,
      #   publishes nothing and exits 0, so `published` is `false`, so the old `if:` SKIPPED this
      #   step, so the run went GREEN with four packages on npm carrying no tag and no release,
      #   permanently, and nothing anywhere saying so.
      #
      # A second route reaches the same place: a partially successful `changeset publish` sets
      # `published=true` and then exits non-zero, so the action's step fails and the implicit
      # `success()` on a bare `if:` skipped this step.
      #
      # SO THE STEP IS IDEMPOTENT AND SELF-HEALING INSTEAD. It runs on `!cancelled()` so a partial
      # publish still tags whatever reached npm, and it asks the REGISTRY whether each bumped package
      # is actually published rather than trusting a per-run output. A re-run therefore completes the
      # job instead of skipping it, and a package that genuinely failed to publish is reported by
      # name rather than counted as done.
      - name: Every bumped package must be published, tagged and released
        if: ${{ !cancelled() && steps.notes.outputs.is-release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMPED_PACKAGES: ${{ steps.notes.outputs.packages }}
          NOTES_DIR: ${{ runner.temp }}/release-notes
        shell: bash
        run: |
          set -euo pipefail

          # Build the work list as its own command rather than as the head of a pipeline, so a
          # producer that dies takes the step with it instead of yielding an empty loop. Process
          # substitution would swallow its exit status.
          worklist="$RUNNER_TEMP/bumped.tsv"
          # shellcheck disable=SC2016  # single quotes are deliberate: this is JS reading process.env,
          # not shell expansion. Interpolating the JSON into the script would break on any quote in it.
          node -e '
            const packages = JSON.parse(process.env.BUMPED_PACKAGES ?? "[]");
            if (!Array.isArray(packages) || packages.length === 0) {
              throw new Error("the notes gate reported a release but named no packages");
            }
            for (const entry of packages) process.stdout.write(`${entry.name}\t${entry.version}\n`);
          ' > "$worklist"

          expected=$(wc -l < "$worklist")
          accounted=0
          missing=()

          while IFS=$'\t' read -r name version; do
            [ -n "$name" ] || continue

            # IS IT ACTUALLY ON THE REGISTRY. Retried, because a publish that has just succeeded can
            # 404 for a few seconds while the registry propagates, and treating that as "failed to
            # publish" would red a correct release.
            onnpm=false
            for attempt in 1 2 3; do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                onnpm=true
                break
              fi
              [ "$attempt" -eq 3 ] || sleep 5
            done

            if [ "$onnpm" != "true" ]; then
              missing+=("${name}@${version}")
              continue
            fi

            # The same transform scripts/release-notes.mjs uses for its output filenames.
            slug=$(printf '%s' "$name" | sed 's|^@||; s|[@/]|-|g')
            notes="$NOTES_DIR/$slug.md"

            if [ ! -f "$notes" ]; then
              echo "::error title=No release body for $name@$version::${name}@${version} is on npm," \
                   "but the notes gate derived no body for it. That is a disagreement between what" \
                   "was published and what this pipeline checked, and it needs a human."
              exit 1
            fi

            # THE RECONCILIATION, and the only check that legitimately follows the publish: it
            # re-reads the finished bytes against the version that actually reached the registry,
            # which is the one fact not available before npm was touched. The body's own fitness was
            # already proved beforehand by the identical `assert` the prepare step runs.
            node scripts/release-notes.mjs assert \
              --file "$notes" --expect-package "$name" --expect-version "$version"

            # Changesets tags `<pkg>@<version>` in a multi-package repo, which is what this repo's
            # existing tags are. Do NOT "simplify" this to `v<version>`: several packages publishing
            # in one run would collide on a single tag.
            tag="${name}@${version}"

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag" --notes-file "$notes"
              echo "Updated the existing release for $tag."
            else
              # `--target` is REQUIRED. `changeset publish` creates the tag only in the runner's
              # local clone, and with `createGithubReleases: false` the action never pushes it, so
              # `gh release create` would otherwise refuse with "tag exists locally but has not been
              # pushed". Pointing --target at this commit makes gh create the tag itself.
              gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"
              echo "Created $tag."
            fi
            accounted=$((accounted + 1))
          done < "$worklist"

          # REFUSE TO REPORT SUCCESS ON A PARTIAL RELEASE. This is the assertion the first draft did
          # not have: it compares what the version commit BUMPED against what is now on the registry
          # and tagged, so "the gate derived eight bodies and only three were used" cannot pass.
          if [ ${#missing[@]} -gt 0 ]; then
            # Say what is true rather than assuming a publish was attempted. Because this step runs
            # on `!cancelled()`, it also fires when an EARLIER step failed (install, or the notes
            # derivation) on a version commit, in which case nothing was ever published and every
            # package is "missing" for a reason that has nothing to do with the registry. Naming
            # both readings costs one line and stops the annotation sending a reader to npm.
            echo "::error title=Bumped but never published::${#missing[@]} of $expected package(s)" \
                 "were bumped by this version commit but are not on the registry:" \
                 "${missing[*]}. Either the publish failed for them, or an earlier step in this job" \
                 "failed and the publish never ran. Check the steps above before the registry."
            if [ "$accounted" -gt 0 ]; then
              echo "The other $accounted package(s) DID publish, and have been tagged and released."
            fi
            exit 1
          fi
          if [ "$accounted" -ne "$expected" ]; then
            echo "::error title=Release accounting does not balance::expected $expected package(s)," \
                 "accounted for $accounted. Refusing to report success."
            exit 1
          fi
          echo "All $expected bumped package(s) are published, tagged and released."

      # THE OTHER DIRECTION: npm published on a commit the notes gate never recognised as a version
      # commit, so no body was derived and the step above did not run. Unreachable unless the wiring
      # broke, and kept for exactly that reason: it is what makes the classifier's correctness
      # observable instead of assumed. It cannot withhold anything (npm has already published), and
      # it deliberately does not invent a release body it never checked.
      - name: Refuse a publish the notes gate never saw
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' && steps.notes.outputs.is-release != 'true' }}
        shell: bash
        run: |
          echo "::error title=Published without a derived release body::npm published, but the" \
               "release-notes gate did not recognise this commit as a version commit, so no body was" \
               "derived and no tag or GitHub release was created. This needs a human: check what" \
               "reached the registry, then tag and release it by hand."
          exit 1

      # When a publish fails, npm writes the only useful diagnostic to
      # ~/.npm/_logs/<timestamp>-debug-0.log on an ephemeral runner and nothing preserves it. Every
      # failed publish this org has had discarded exactly the file the registry then asks for:
      # @cosyte/fhir's E403 ticket needed it and could not be given it.
      #
      # REDACTION is defensive rather than evidence-driven: measured on 2026-07-27 against npm 10.9.8,
      # the log records config FILE PATHS and never their contents, so today's log is clean. The npm
      # version moves under us and this repo is public, so the rules stay. If anything
      # credential-shaped survives redaction the upload is SKIPPED: a support diagnostic is not worth
      # a leaked token.
      - name: Collect the npm debug log
        if: failure()
        id: npm-log
        shell: bash
        run: |
          shopt -s nullglob
          logs=(~/.npm/_logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No npm debug log under ~/.npm/_logs, so this failure was not a publish. Nothing to collect."
            exit 0
          fi
          dest="$RUNNER_TEMP/npm-debug-logs"
          mkdir -p "$dest"
          for log in "${logs[@]}"; do
            sed -E \
              -e 's/(_authToken|_auth|_password|authToken)([[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1\2REDACTED/gI' \
              -e 's/([Aa]uthorization[^[:alnum:]]{0,4})(([Bb]earer|[Bb]asic)[[:space:]]+)[A-Za-z0-9._~+=\/-]+/\1\2REDACTED/g' \
              -e 's/npm_[A-Za-z0-9]{36}/npm_REDACTED/g' \
              -e 's/gh[pousr]_[A-Za-z0-9]{36,}/gh_REDACTED/g' \
              -e 's/github_pat_[A-Za-z0-9_]{22,}/github_pat_REDACTED/g' \
              "$log" > "$dest/$(basename "$log")"
          done
          # Assert on the bytes that would be uploaded, not on the fact that sed ran.
          if grep -rqiE 'npm_[A-Za-z0-9]{36}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,}|(_auth|_authToken|_password)[[:space:]]*[=:][[:space:]]*[^R[:space:]]|(bearer|basic)[[:space:]]+[A-Za-z0-9._~+=/-]{16,}' "$dest"; then
            echo "::error::Credential-shaped text survived redaction in the npm debug log, so it will NOT be uploaded. Fix the redaction here before relying on this artifact."
            rm -rf "$dest"
            exit 1
          fi
          {
            echo "collected=true"
            echo "artifact-name=npm-debug-log-config-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
          echo "Collected ${#logs[@]} npm debug log(s)."
      - name: Upload the npm debug log
        if: ${{ failure() && steps.npm-log.outputs.collected == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.npm-log.outputs.artifact-name }}
          path: ${{ runner.temp }}/npm-debug-logs/*.log
          if-no-files-found: warn
          retention-days: 30
