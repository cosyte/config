version: 2
updates:
  # npm: the workspace toolchain, its dev-dependencies grouped into one weekly pull request
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Wait a day after a release before proposing it, the same 24 hours pnpm-workspace.yaml's
    # minimumReleaseAge holds every install to. Security updates are not delayed.
    cooldown:
      default-days: 1
    # Conventional Commits titles, which the PR title check requires: chore(deps) and
    # chore(deps-dev).
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node describes the oldest Node.js the packages run on (engines: >=22), so it stays
      # on the 22 line, which drift-manifest.json's devDepVersions also asks of every repo. A newer
      # major type-checks calls that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # keep GitHub Actions references current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # From v1.75.0 this action installs actionlint by piping a script from a fork to bash. ci.yml's
      # `actionlint` job runs the official rhysd/actionlint release, checked by its SHA-256, instead.
      - dependency-name: "reviewdog/action-actionlint"
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller, together. Left to Dependabot, a commit
      # pin with no version tag is offered the newest commit on cosyte/.github's main, which is not a
      # published reference.
      - dependency-name: "cosyte/.github*"
