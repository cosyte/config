name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    # Public repositories only: CodeQL is free on a public repository and needs paid GitHub Code
    # Security on a private one, which we do not turn on. A push or pull request on a private
    # repository skips this job. (A scheduled run's event carries no repository, so it still starts
    # there, and fails at the upload rather than enabling anything.)
    if: ${{ github.event.repository.private != true }}
    permissions:
      security-events: write # upload the SARIF to the Security tab
      contents: read
      actions: read
    uses: cosyte/.github/.github/workflows/codeql.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
