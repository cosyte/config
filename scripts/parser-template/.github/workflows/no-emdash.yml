name: Em-dash gate

# The em and en dash gate (ST8, ST34): the shared implementation in @cosyte/script-utils, run by the
# shared workflow over every tracked file and over the PR title, body and commit messages. What
# this repository leaves out, if anything, goes in scripts/check-no-emdash.exclude, which the gate
# reads for itself. The workflow installs from the lockfile first: the gate lives in node_modules.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title or body edit can arrive together (Dependabot does both),
# and a run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a
# failed check and block the merge until someone re-runs it. Every run finishes and the newest
# result stands.

permissions:
  contents: read

jobs:
  no-emdash:
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    permissions:
      contents: read
