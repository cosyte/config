name: Em-dash gate

# The em and en dash gate (ST8, ST34): the shared implementation in @cosyte/script-utils, run by the
# shared workflow over every tracked file and over the PR title, body and commit messages. What
# this repository leaves out, if anything, goes in scripts/check-no-emdash.exclude, which the gate
# reads for itself. The workflow installs from the lockfile first: the gate lives in node_modules.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-emdash:
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    permissions:
      contents: read
