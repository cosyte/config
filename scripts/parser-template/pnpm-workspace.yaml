# INSTALL HARDENING, SHIPPED BY THE SCAFFOLD SO A NEW REPO IS NOT BORN IN DRIFT.
#
# drift-manifest.json's `installHardening` group requires both of these of every @cosyte/* package
# repo, so a repo generated without them would report drift on the day it was created. They are here
# rather than in .npmrc because pnpm's documented examples put them in this file, and .npmrc is not
# among the routes pnpm names for configuring them explicitly.
#
# THIS REPOSITORY IS NOT A WORKSPACE, and the absence of a `packages:` key is deliberate: at pnpm 10
# this file is the settings file, not only the workspace manifest, so a single-package repo uses it
# for settings and declares no members.
#
# Both controls ship SWITCHED OFF at pnpm 10 (the cooldown defaults to 0 before v11, the trust
# policy to `off`), so deleting either line does not fall back to a weaker setting: it turns the
# control off. `pnpm --dir ../config run drift` grades this file and says which value it wanted.
#
# THEY ALSO NEED A pnpm THAT KNOWS THEM. `minimumReleaseAge` arrived in pnpm 10.16.0 and
# `trustPolicy` in 10.21.0, and an older pnpm ignores both keys silently, which is a settings file
# that decorates rather than defends. That is why this template's `packageManager` pins the same
# 10.34.5 the toolchain root pins rather than the bare 10.0.0 it used to carry.

# 1440 minutes = 24 hours. pnpm's own rationale: "Since malware is usually detected quickly,
# delaying updates by 24 hours will most likely prevent you from installing a bad version"
# (https://pnpm.io/supply-chain-security).
minimumReleaseAge: 1440

# Fail the install when a package's trust evidence is weaker than that of an earlier-published
# version of the same package. Exemptions go in `trustPolicyExclude` below, one entry per line,
# each with a "# reason: ..." comment above it saying why the hole is acceptable.
trustPolicy: no-downgrade

# THE SAME EXCLUSIONS config'S OWN pnpm-workspace.yaml CARRIES, AND NO OTHERS. A new repo resolves
# the same toolchain config does, so it meets the same packages. Without these its first
# `pnpm install` stops with ERR_PNPM_TRUST_DOWNGRADE. config's test/scaffold-repo-standards.test.ts
# holds this list equal to config's own, so add or drop an entry in both files at once.
trustPolicyExclude:
  # reason: undici-types is reached as a transitive of @types/node. Earlier releases carry a
  # provenance attestation and 6.21.0 carries none, which is a publisher who stopped attaching
  # provenance rather than a takeover: the package is a types-only tarball with no runtime code and
  # no install scripts. Pinned to this one version, so a LATER undici-types release is graded again
  # rather than inheriting this exemption.
  - "undici-types@6.21.0"
  # reason: carried because config's own list carries it. Earlier chokidar releases carry a
  # provenance attestation and 4.0.3 carries none; pnpm's own documentation uses this exact package
  # and version as its worked example of a trustPolicyExclude entry
  # (https://pnpm.io/settings/dependency-resolution). tsup 9, reached through @cosyte/process,
  # resolves chokidar 5.0.0 today, so this entry matters only to a repo that pins an older tsup.
  # Pinned to this one version, so no other chokidar release inherits this exemption.
  - "chokidar@4.0.3"
